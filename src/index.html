<!doctype html>

  <link rel="preload" href="/assets/fonts/cormorant-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // js liga as animações de entrada (sem JS tudo aparece no lugar)
    document.documentElement.classList.add('js')
    // abertura com a logo: uma vez por visita e nunca pra quem pediu menos movimento.
    // ?abertura no endereço força a abertura (pra revisar sem abrir aba anônima)
    try {
      var forcar = /[?&]abertura(=|&|$)/.test(location.search)
      if ((forcar || !sessionStorage.getItem('jv-abertura')) && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('abre')
        sessionStorage.setItem('jv-abertura', '1')
      }
    } catch (e) {}
  </script>
  <title>Dr. Jonathan Vale, Advogado | Atendimento em todo o Brasil</title>
